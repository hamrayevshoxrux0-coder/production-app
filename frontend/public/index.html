<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#1a56db" />
  <meta name="description" content="Ishlab chiqarish boshqaruv tizimi" />
  <title>Ishlab chiqarish tizimi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #111827; }
    :root {
      --color-background-primary: #ffffff;
      --color-background-secondary: #f9fafb;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-border-tertiary: #e5e7eb;
      --font-sans: 'Inter', sans-serif;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary: #1f2937;
        --color-background-secondary: #111827;
        --color-text-primary: #f9fafb;
        --color-text-secondary: #9ca3af;
        --color-border-tertiary: #374151;
      }
      body { background: #111827; }
    }
    input, select, textarea, button { font-family: inherit; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
